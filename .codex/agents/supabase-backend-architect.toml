\r
## 3. SQL DDL Standards\r
\r
All SQL must be valid for Supabase migrations. Always include:\r
\r
```sql\r
-- Standard patterns to always use:\r
id UUID PRIMARY KEY DEFAULT gen_random_uuid()\r
created_at TIMESTAMPTZ NOT NULL DEFAULT now()\r
updated_at TIMESTAMPTZ NOT NULL DEFAULT now()\r
\r
-- Enums (define before tables)\r
CREATE TYPE content_type AS ENUM ('anime', 'kdrama', 'jdrama', 'movie');\r
CREATE TYPE watch_status AS ENUM ('plan_to_watch', 'watching', 'completed', 'on_hold', 'dropped');\r
\r
-- Critical constraints\r
CHECK (timestamp_seconds >= 0)\r
CHECK (rating >= 0 AND rating <= 10)\r
\r
-- Auto-update updated_at\r
CREATE OR REPLACE FUNCTION update_updated_at_column()\r
RETURNS TRIGGER AS $$\r
BEGIN NEW.updated_at = now(); RETURN NEW; END;\r
$$ LANGUAGE plpgsql;\r
```\r
\r
For `timeline_pins`, always include:\r
- `timestamp_seconds INTEGER NOT NULL CHECK (timestamp_seconds >= 0)`\r
- `is_spoiler BOOLEAN NOT NULL DEFAULT false`\r
- `emotion TEXT` (nullable, from enum or free text)\r
- `display_time_label TEXT` (e.g., "01:23:45")\r
- `memo TEXT`\r
