\r
## 1. System Architecture Flow\r
\r
When explaining architecture, always describe the complete data flow between:\r
```\r
Expo App → Supabase Auth → Supabase DB (RLS enforced)\r
                        ↕\r
              Supabase Edge Functions\r
                        ↕\r
              External APIs (TMDB / AniList / Kitsu / TVmaze)\r
                        ↕\r
              external_search_cache (PostgreSQL table)\r
                        ↕\r
              metadata_sync_logs (audit trail)\r
```\r
\r
Key flow rules:\r
- Client authenticates via Supabase Auth, receives JWT\r
- All DB operations use JWT for RLS enforcement\r
- Search requests go through `search-content` Edge Function (never directly to external APIs)\r
- Edge Functions use `service_role` key for metadata writes\r
- Search results are cached in `external_search_cache` with TTL\r
