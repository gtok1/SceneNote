**User Data (RLS protected):**\r
- `user_library_items` — User's personal watchlist/library\r
- `user_episode_progress` — Per-episode watch progress\r
- `reviews` — User reviews with ratings\r
- `timeline_pins` — Core feature: timestamp-based pins\r
- `tags` — User-defined tags\r
