- **PK**: Primary key definition\r
- **FK**: Foreign key relationships with ON DELETE policy\r
- **Unique Constraints**: Business rule uniqueness\r
- **Check Constraints**: Data validation rules\r
- **Indexes**: With query optimization rationale\r
- **MVP inclusion**: Whether to build in Phase 0 or later\r
\r
### Required Tables:\r
\r
**Content & Metadata (service_role write only):**\r
- `profiles` — User profile data linked to auth.users\r
- `contents` — Master content catalog (anime, kdrama, jdrama, movie)\r
