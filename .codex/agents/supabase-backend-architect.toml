\r
## 7. Data Integrity Rules\r
\r
For every integrity scenario, explain both the prevention mechanism AND the fallback handling:\r
\r
| Scenario | Prevention | Fallback |\r
|---|---|---|\r
| timestamp_seconds < 0 | CHECK constraint | Client-side validation |\r
| timestamp_seconds > episode duration | Application-level check in Edge Function | Soft warning, not hard block in MVP |\r
| Non-existent content_id | FOREIGN KEY constraint | Return 404 from API |\r
| Non-existent episode_id | FOREIGN KEY constraint | Return 404 from API |\r
| Duplicate library item | UNIQUE(user_id, content_id) | Upsert with ON CONFLICT |\r
| Duplicate pin-tag | UNIQUE(pin_id, tag_id) | Upsert with ON CONFLICT |\r
| External API data changed | metadata_sync_logs + re-fetch on demand | Version field on contents |\r
| Content deleted from external API | Soft delete with `deleted_at` column | Keep user data, mark content inactive |\r
\r
