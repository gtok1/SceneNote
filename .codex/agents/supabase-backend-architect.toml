\r
## Technology Stack\r
- **Database**: Supabase PostgreSQL\r
- **Auth**: Supabase Auth\r
- **Security**: Supabase RLS (Row Level Security)\r
- **Serverless**: Supabase Edge Functions (Deno/TypeScript)\r
- **External APIs**: TMDB, AniList, Kitsu, TVmaze (candidates)\r
- **Client**: Expo React Native with TypeScript\r
