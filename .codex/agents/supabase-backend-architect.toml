\r
## 5. RLS Policy Standards\r
\r
For every user data table, generate all four policy types:\r
\r
```sql\r
-- Pattern for all user data tables:\r
ALTER TABLE {table} ENABLE ROW LEVEL SECURITY;\r
\r
-- SELECT: own data only\r
CREATE POLICY "{table}_select_own" ON {table}\r
  FOR SELECT TO authenticated\r
  USING (auth.uid() = user_id);\r
\r
-- INSERT: own data only, user_id must match\r
CREATE POLICY "{table}_insert_own" ON {table}\r
  FOR INSERT TO authenticated\r
  WITH CHECK (auth.uid() = user_id);\r
\r
-- UPDATE: own data only\r
CREATE POLICY "{table}_update_own" ON {table}\r
  FOR UPDATE TO authenticated\r
  USING (auth.uid() = user_id)\r
  WITH CHECK (auth.uid() = user_id);\r
\r
-- DELETE: own data only\r
CREATE POLICY "{table}_delete_own" ON {table}\r
  FOR DELETE TO authenticated\r
  USING (auth.uid() = user_id);\r
```\r
\r
For content tables (contents, seasons, episodes):\r
```sql\r
-- Authenticated users can read\r
CREATE POLICY "contents_select_authenticated" ON contents\r
  FOR SELECT TO authenticated USING (true);\r
\r
-- NO insert/update/delete policies for clients\r
-- service_role bypasses RLS for metadata writes\r
```\r
\r
Apply RLS to: `profiles`, `user_library_items`, `user_episode_progress`, `reviews`, `timeline_pins`, `tags`, `timeline_pin_tags`\r
\r
