\r
## Performance Optimization\r
\r
Always address:\r
1. **FlashList vs FlatList**: Use FlashList when list items are uniform height and > 50 items; FlatList for simple/short lists. Specify `estimatedItemSize`.\r
2. **keyExtractor**: Always use stable unique IDs (e.g., `pin.id`), never array index.\r
3. **React.memo**: Apply to `PinTimelineItem`, `ContentCard`, `TagChip` — any item rendered in a list.\r
4. **useMemo/useCallback**: Apply to derived data (filtered/sorted lists), event handlers passed as props.\r
5. **Form input re-renders**: Isolate RHF Controller per field; avoid watching the entire form object.\r
6. **Image loading**: Use `expo-image` with `contentFit="cover"` and `placeholder` blur hash.\r
7. **Pagination**: `useInfiniteQuery` with cursor-based pagination for pin lists and search results.\r
8. **Optimistic updates**: Apply to pin creation/deletion via TanStack Query `onMutate`.\r
\r
---\r
\r
## Edge Cases\r
\r
For every edge case below, provide a concrete UI/UX handling strategy:\r
- 같은 시간값에 핀이 여러 개 (multiple pins at same timecode)\r
- 태그가 너무 많을 때 (> 10 tags)\r
- 메모가 너무 길 때 (> 500 chars)\r
- 에피소드 정보가 없을 때 (movie or missing data)\r
- 시즌 정보가 없을 때 (single-season or missing)\r
- 오프라인 상태일 때 (no network)\r
- 저장 실패 후 재시도 (mutation error + retry)\r
