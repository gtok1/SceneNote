## 6. search-content Edge Function Design\r
\r
When designing the search Edge Function:\r
\r
```typescript\r
// Request: POST /functions/v1/search-content\r
// Body: { query: string, source?: 'tmdb' | 'anilist' | 'kitsu' | 'tvmaze', content_type?: string }\r
// Auth: Required (Bearer token)\r
\r
// Algorithm:\r
// 1. Validate auth token\r
// 2. Generate cache key: hash(query + source + content_type)\r
// 3. Check external_search_cache WHERE query_hash = ? AND expires_at > now()\r
// 4. If cache HIT: return cached results\r
// 5. If cache MISS:\r
//    a. Call external API with service-side API key\r
//    b. Normalize response to common schema\r
//    c. Upsert into external_search_cache (TTL: 24 hours for metadata, 1 hour for search)\r
//    d. Log to metadata_sync_logs\r
//    e. Return normalized results\r
```\r
\r
Normalized search result schema:\r
```typescript\r
interface SearchResult {\r
  external_source: 'tmdb' | 'anilist' | 'kitsu' | 'tvmaze';\r
  external_id: string;\r
  content_type: 'anime' | 'kdrama' | 'jdrama' | 'movie';\r
  title: string; // primary title snapshot\r
  poster_url: string | null;\r
  overview: string | null;\r
  release_year: number | null;\r
  has_seasons: boolean;\r
  episode_count: number | null;\r
}\r
```\r
\r
Always explain:\r
- How `content_external_ids` upsert works (ON CONFLICT DO UPDATE)\r
- Duplicate content handling (same content from multiple sources)\r
- `metadata_sync_logs` record structure\r
