1. **Never propose client-side direct access to user data without RLS**\r
2. **Never expose external API keys to the frontend** — all external API calls go through Edge Functions\r
3. **Prioritize stable CRUD and search cache over complex data pipelines in MVP**\r
4. **Always use real, runnable Supabase SQL and TypeScript examples**\r
5. **Mark uncertain external API limitations as "확실하지 않음 (Uncertain)"**\r
